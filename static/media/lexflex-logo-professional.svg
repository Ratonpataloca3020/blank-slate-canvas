<svg width="280" height="70" viewBox="0 0 280 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Plata Cromada -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#E8E8E8"/>
      <stop offset="50%" style="stop-color:#B8B8B8"/>
      <stop offset="70%" style="stop-color:#D4D4D4"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    
    <!-- Gradiente Rojo Brillante -->
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="30%" style="stop-color:#E30613"/>
      <stop offset="50%" style="stop-color:#B00510"/>
      <stop offset="70%" style="stop-color:#E30613"/>
      <stop offset="100%" style="stop-color:#FF2020"/>
    </linearGradient>
    
    <!-- Brillo superior -->
    <linearGradient id="topShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- LEXFLEX en plata -->
  <g filter="url(#shadow)">
    <text x="8" y="38" 
          font-family="'Arial Black', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="30" 
          font-weight="900" 
          fill="url(#silver)" 
          letter-spacing="0.5">LEXFLEX</text>
  </g>
  
  <!-- Brillo en LEXFLEX -->
  <text x="8" y="38" 
        font-family="'Arial Black', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="30" 
        font-weight="900" 
        fill="url(#topShine)" 
        letter-spacing="0.5">LEXFLEX</text>
  
  <!-- PERU en rojo -->
  <g filter="url(#shadow)">
    <text x="155" y="38" 
          font-family="'Arial Black', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="30" 
          font-weight="900" 
          fill="url(#red)" 
          letter-spacing="0.5">PERU</text>
  </g>
  
  <!-- Brillo en PERU -->
  <text x="155" y="38" 
        font-family="'Arial Black', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="30" 
        font-weight="900" 
        fill="url(#topShine)" 
        letter-spacing="0.5"
        opacity="0.4">PERU</text>
  
  <!-- Línea decorativa superior -->
  <line x1="8" y1="10" x2="48" y2="10" stroke="#C0C0C0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="54" cy="10" r="2" fill="#E30613"/>
  <line x1="60" y1="10" x2="85" y2="10" stroke="#C0C0C0" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Tagline -->
  <text x="8" y="54" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="8" 
        font-weight="400" 
        fill="#999999" 
        letter-spacing="3">SOLUCIONES LEGALES, A TU MEDIDA</text>
  
  <!-- Línea decorativa inferior con acento rojo -->
  <line x1="8" y1="61" x2="80" y2="61" stroke="#C0C0C0" stroke-width="1" opacity="0.6"/>
  <line x1="85" y1="61" x2="120" y2="61" stroke="#E30613" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="61" x2="272" y2="61" stroke="#C0C0C0" stroke-width="1" opacity="0.6"/>
</svg>