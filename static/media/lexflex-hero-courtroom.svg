<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Background -->
  <rect width="1200" height="600" fill="#1a1a2e"/>
  
  <!-- Wood paneling accent -->
  <rect width="1200" height="600" fill="url(#woodGradient)"/>
  
  <!-- Lighting effects -->
  <rect width="1200" height="200" fill="url(#lightingTop)" opacity="0.6"/>
  
  <!-- Define gradients -->
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2f3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161f2e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lightingTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6a8a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="benchGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d4e37;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="suitGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Judge's bench (elevated platform) -->
  <rect x="400" y="80" width="400" height="40" fill="url(#benchGradient)" rx="2"/>
  
  <!-- Judge's chair backing -->
  <rect x="520" y="50" width="160" height="80" fill="#6d5c3f" rx="3"/>
  <rect x="525" y="55" width="150" height="70" fill="#8b7355" rx="2"/>
  
  <!-- Judge figure -->
  <g>
    <!-- Head -->
    <circle cx="600" cy="110" r="18" fill="#d4a574"/>
    <!-- Robes -->
    <ellipse cx="600" cy="160" rx="35" ry="45" fill="#1a1a1a"/>
    <rect x="565" y="130" width="70" height="60" fill="#1a1a1a"/>
    <!-- Arms -->
    <rect x="535" y="140" width="25" height="50" fill="#d4a574" rx="12"/>
    <rect x="640" y="140" width="25" height="50" fill="#d4a574" rx="12"/>
    <!-- Gavel hand -->
    <circle cx="645" cy="190" r="8" fill="#d4a574"/>
  </g>
  
  <!-- Gavel -->
  <rect x="655" y="175" width="6" height="35" fill="#8b4513"/>
  <rect x="645" y="175" width="26" height="12" fill="#a0522d" rx="1"/>
  <line x1="658" y1="212" x2="658" y2="245" stroke="#a0522d" stroke-width="2"/>
  <ellipse cx="658" cy="250" rx="12" ry="6" fill="#8b4513"/>
  
  <!-- Witness stand/Attorney desk -->
  <g>
    <!-- Left attorney desk -->
    <rect x="150" y="280" width="160" height="80" fill="url(#benchGradient)" rx="2"/>
    <rect x="160" y="270" width="140" height="15" fill="#6d5c3f"/>
    
    <!-- Left attorney 1 -->
    <circle cx="195" cy="220" r="16" fill="#d4a574"/>
    <ellipse cx="195" cy="270" rx="32" ry="40" fill="url(#suitGradient)"/>
    <rect x="165" y="245" width="20" height="50" fill="#d4a574" rx="10"/>
    <rect x="210" y="245" width="20" height="50" fill="#d4a574" rx="10"/>
    <!-- Document in hand -->
    <rect x="220" y="280" width="45" height="60" fill="#f5f5dc" stroke="#333" stroke-width="1"/>
    <line x1="230" y1="295" x2="255" y2="295" stroke="#666" stroke-width="1"/>
    <line x1="230" y1="310" x2="255" y2="310" stroke="#666" stroke-width="1"/>
    <line x1="230" y1="325" x2="255" y2="325" stroke="#666" stroke-width="1"/>
    
    <!-- Right attorney desk -->
    <rect x="890" y="280" width="160" height="80" fill="url(#benchGradient)" rx="2"/>
    <rect x="900" y="270" width="140" height="15" fill="#6d5c3f"/>
    
    <!-- Right attorney 2 -->
    <circle cx="955" cy="220" r="16" fill="#d4a574"/>
    <ellipse cx="955" cy="270" rx="32" ry="40" fill="url(#suitGradient)"/>
    <rect x="925" y="245" width="20" height="50" fill="#d4a574" rx="10"/>
    <rect x="970" y="245" width="20" height="50" fill="#d4a574" rx="10"/>
    <!-- Briefcase -->
    <rect x="890" y="290" width="50" height="35" fill="#3d3d3d" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="895" y="285" width="40" height="8" fill="#2a2a2a"/>
  </g>
  
  <!-- Bailiff/Court officer -->
  <g>
    <circle cx="500" cy="380" r="14" fill="#d4a574"/>
    <ellipse cx="500" cy="420" rx="28" ry="35" fill="#2a2a2a"/>
    <rect x="475" y="405" width="18" height="45" fill="#d4a574" rx="9"/>
    <rect x="507" y="405" width="18" height="45" fill="#d4a574" rx="9"/>
  </g>
  
  <!-- Jury seating area (background) -->
  <g opacity="0.4">
    <rect x="50" y="380" width="200" height="180" fill="#3a4a5a" rx="2"/>
    <circle cx="85" cy="410" r="8" fill="#d4a574"/>
    <circle cx="135" cy="410" r="8" fill="#d4a574"/>
    <circle cx="185" cy="410" r="8" fill="#d4a574"/>
    <circle cx="85" cy="460" r="8" fill="#d4a574"/>
    <circle cx="135" cy="460" r="8" fill="#d4a574"/>
    <circle cx="185" cy="460" r="8" fill="#d4a574"/>
    <text x="100" y="520" font-size="14" fill="#9a9a9a" font-family="Arial">JURY</text>
  </g>
  
  <!-- Court seal/emblem in background -->
  <g opacity="0.15">
    <circle cx="600" cy="400" r="80" fill="none" stroke="#c0c0c0" stroke-width="2"/>
    <circle cx="600" cy="400" r="75" fill="none" stroke="#c0c0c0" stroke-width="1"/>
    <text x="600" y="410" font-size="24" fill="#c0c0c0" font-family="Georgia, serif" text-anchor="middle" font-weight="bold">JUSTICIA</text>
  </g>
  
  <!-- Columns/Architecture elements -->
  <g opacity="0.3">
    <rect x="30" y="0" width="20" height="600" fill="#5a6a7a"/>
    <rect x="1150" y="0" width="20" height="600" fill="#5a6a7a"/>
  </g>
  
  <!-- Floor detail -->
  <rect y="560" width="1200" height="40" fill="#2a3a3a"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#4a5a6a" stroke-width="1" opacity="0.5"/>
  
  <!-- Subtle grid pattern floor -->
  <g opacity="0.1" stroke="#6a7a8a" stroke-width="1">
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
    <line x1="0" y1="590" x2="1200" y2="590"/>
    <line x1="100" y1="560" x2="100" y2="600"/>
    <line x1="200" y1="560" x2="200" y2="600"/>
    <line x1="300" y1="560" x2="300" y2="600"/>
    <line x1="400" y1="560" x2="400" y2="600"/>
    <line x1="500" y1="560" x2="500" y2="600"/>
    <line x1="600" y1="560" x2="600" y2="600"/>
    <line x1="700" y1="560" x2="700" y2="600"/>
    <line x1="800" y1="560" x2="800" y2="600"/>
    <line x1="900" y1="560" x2="900" y2="600"/>
    <line x1="1000" y1="560" x2="1000" y2="600"/>
    <line x1="1100" y1="560" x2="1100" y2="600"/>
  </g>
  
  <!-- Lighting effects (spotlights) -->
  <g opacity="0.2">
    <ellipse cx="600" cy="100" rx="250" ry="150" fill="#ffffff"/>
  </g>
  
  <!-- Red accent line (Lexflex brand) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#E30613" stroke-width="3"/>
</svg>
