<svg width="240" height="65" viewBox="0 0 240 65" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Plata Cromada -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente Rojo Cromado -->
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E30613;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2020;stop-opacity:1" />
    </linearGradient>
    
    <!-- Brillo -->
    <filter id="shine">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feSpecularLighting result="spec" specularExponent="25" lighting-color="#ffffff">
        <fePointLight x="20" y="10" z="100"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  
  <!-- L (Plata) -->
  <path d="M 8 12 L 14 12 L 14 50 L 28 50 L 28 56 L 8 56 Z" 
        fill="url(#silver)" 
        filter="url(#shine)"/>
  
  <!-- F (Rojo) -->
  <path d="M 35 12 L 55 12 L 55 18 L 41 18 L 41 30 L 53 30 L 53 36 L 41 36 L 41 56 L 35 56 Z" 
        fill="url(#red)" 
        filter="url(#shine)"/>
  
  <!-- Curva decorativa -->
  <path d="M 26 28 Q 32 24, 42 32" 
        stroke="url(#red)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Balanza mini -->
  <g transform="translate(60, 20) scale(0.5)">
    <rect x="-1" y="10" width="2" height="30" fill="url(#silver)"/>
    <rect x="-22" y="9" width="44" height="2" fill="url(#silver)" rx="1"/>
    <line x1="-17" y1="11" x2="-17" y2="20" stroke="url(#silver)" stroke-width="1"/>
    <ellipse cx="-17" cy="22" rx="6" ry="2" fill="none" stroke="url(#silver)" stroke-width="1"/>
    <line x1="17" y1="11" x2="17" y2="20" stroke="url(#silver)" stroke-width="1"/>
    <ellipse cx="17" cy="22" rx="6" ry="2" fill="none" stroke="url(#silver)" stroke-width="1"/>
    <circle cx="-17" cy="7" r="2" fill="#E30613"/>
    <circle cx="17" cy="7" r="2" fill="#E30613"/>
  </g>
  
  <!-- LEXFLEX (Plata) -->
  <text x="8" y="62" 
        font-family="'Arial Black', sans-serif" 
        font-size="14" 
        font-weight="900" 
        fill="url(#silver)" 
        letter-spacing="1">LEXFLEX</text>
  
  <!-- PERU (Rojo) -->
  <text x="100" y="62" 
        font-family="'Arial Black', sans-serif" 
        font-size="14" 
        font-weight="900" 
        fill="url(#red)" 
        letter-spacing="1">PERU</text>
  
  <!-- Tagline pequeño -->
  <text x="120" y="64" 
        text-anchor="middle"
        font-family="Arial, sans-serif" 
        font-size="5" 
        fill="#999" 
        letter-spacing="1.5">SOLUCIONES LEGALES</text>
</svg>
