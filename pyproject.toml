[project]
name = "lexflex-legal-peru"
version = "0.1.0"
description = "Sitio web institucional de Lexflex - Estudio Jurídico"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "aiofiles>=24.1.0",
    "openai>=1.57.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8080"
start = "uvicorn app.main:app --host 0.0.0.0 --port 8080"

[tool.ruff]
line-length = 100
target-version = "py311"
