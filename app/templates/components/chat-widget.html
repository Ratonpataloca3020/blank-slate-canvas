/* ============================================

   ============================================ */

.chat-widget-container {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 999;
}

/* Chat Trigger Button */
.chat-trigger {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    background: linear-gradient(135deg, var(--gold-champagne), var(--gold-dark));
    color: var(--midnight);
    border: none;
    border-radius: 50px;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    transition: all 0.3s ease;
}

.chat-trigger span {
    color: #000;
    font-weight: 700;
}

.chat-trigger:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
}

.chat-trigger svg {
    width: 20px;
    height: 20px;
    color: #000;
    stroke: #000;
}

.chat-trigger.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
}

/* Chat Panel */
.chat-panel {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 420px;
    max-width: calc(100vw - 2rem);
    height: 600px;
    max-height: calc(100vh - 8rem);
    background: var(--linen);
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.chat-panel.active {
    display: flex;
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* Chat Header */
.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    padding: 2rem;

    font-weight: 400;
}

.chat-close {

    width: 36px;

    background: rgba(255, 255, 255, 0.1);

    border-radius: 8px;
    color: rgba(255, 255, 255, 0.7);

    transition: all 0.3s ease;
}

.chat-close:hover {

}

.chat-messages {

.chat-messages::-webkit-scrollbar-track {

}

.chat-messages::-webkit-scrollbar-thumb {

}

/* Responsive */
@media (max-width: 768px) {
    .chat-widget-container {

    .chat-trigger {
        width: 100%;
        justify-content: center;
    }

    .chat-panel {
        width: 100%;
        height: calc(100vh - 4rem);
        max-height: none;
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
