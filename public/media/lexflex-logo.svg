<svg width="280" height="70" viewBox="0 0 280 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Plata Cromada -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente Rojo Cromado -->
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E30613;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2020;stop-opacity:1" />
    </linearGradient>
    
    <!-- Brillo metálico -->
    <filter id="shine">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feSpecularLighting result="spec" specularExponent="25" lighting-color="#ffffff">
        <fePointLight x="20" y="10" z="100"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  
  <!-- L (Plata) -->
  <path d="M 10 14 L 17 14 L 17 54 L 34 54 L 34 61 L 10 61 Z" 
        fill="url(#silver)" 
        filter="url(#shine)"/>
  
  <!-- F (Rojo) -->
  <path d="M 42 14 L 66 14 L 66 21 L 49 21 L 49 34 L 63 34 L 63 41 L 49 41 L 49 61 L 42 61 Z" 
        fill="url(#red)" 
        filter="url(#shine)"/>
  
  <!-- Curva decorativa roja -->
  <path d="M 32 34 Q 40 28, 50 38" 
        stroke="url(#red)" 
        stroke-width="3.5" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.85"/>
  
  <!-- Línea de brillo en curva -->
  <path d="M 32 34 Q 40 28, 50 38" 
        stroke="#FFFFFF" 
        stroke-width="1" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.4"/>
  
  <!-- Balanza de justicia (mini) -->
  <g transform="translate(74, 24) scale(0.65)">
    <!-- Base -->
    <ellipse cx="0" cy="42" rx="7" ry="2" fill="url(#silver)" opacity="0.6"/>
    
    <!-- Columna -->
    <rect x="-1.2" y="12" width="2.4" height="30" fill="url(#silver)" filter="url(#shine)"/>
    
    <!-- Barra horizontal -->
    <rect x="-18" y="10.5" width="36" height="3" fill="url(#silver)" rx="1.5" filter="url(#shine)"/>
    
    <!-- Plato izquierdo -->
    <g transform="translate(-14, 13.5)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="url(#silver)" stroke-width="1.2"/>
      <ellipse cx="0" cy="12" rx="7" ry="1.8" fill="none" stroke="url(#silver)" stroke-width="1.2"/>
      <path d="M -7 12 L -6 18 L 6 18 L 7 12" fill="none" stroke="url(#silver)" stroke-width="1.2"/>
    </g>
    
    <!-- Plato derecho -->
    <g transform="translate(14, 13.5)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="url(#silver)" stroke-width="1.2"/>
      <ellipse cx="0" cy="12" rx="7" ry="1.8" fill="none" stroke="url(#silver)" stroke-width="1.2"/>
      <path d="M -7 12 L -6 18 L 6 18 L 7 12" fill="none" stroke="url(#silver)" stroke-width="1.2"/>
    </g>
    
    <!-- Detalles rojos -->
    <circle cx="-14" cy="9" r="2" fill="#E30613" opacity="0.85"/>
    <circle cx="14" cy="9" r="2" fill="#E30613" opacity="0.85"/>
  </g>
  
  <!-- LEXFLEX (Plata cromada) -->
  <text x="10" y="68" 
        font-family="'Arial Black', 'Helvetica', sans-serif" 
        font-size="16" 
        font-weight="900" 
        fill="url(#silver)" 
        letter-spacing="1.2">LEXFLEX</text>
  
  <!-- PERU (Rojo cromado) -->
  <text x="118" y="68" 
        font-family="'Arial Black', 'Helvetica', sans-serif" 
        font-size="16" 
        font-weight="900" 
        fill="url(#red)" 
        letter-spacing="1.2">PERU</text>
  
  <!-- Línea decorativa roja -->
  <rect x="189" y="63" width="2" height="6" fill="#E30613" rx="1" opacity="0.6"/>
  
  <!-- Tagline pequeño -->
  <text x="198" y="68" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="6.5" 
        font-weight="400" 
        fill="#999" 
        letter-spacing="1.8">SOLUCIONES LEGALES</text>
</svg>
