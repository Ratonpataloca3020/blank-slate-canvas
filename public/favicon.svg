<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E30613;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C00510;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo oscuro -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  
  <!-- L (Plata) -->
  <path d="M 12 14 L 17 14 L 17 42 L 28 42 L 28 47 L 12 47 Z" 
        fill="url(#silver)"/>
  
  <!-- F (Rojo) -->
  <path d="M 32 14 L 48 14 L 48 19 L 37 19 L 37 28 L 46 28 L 46 33 L 37 33 L 37 47 L 32 47 Z" 
        fill="url(#red)"/>
  
  <!-- Curva decorativa roja -->
  <path d="M 26 28 Q 32 24, 38 32" 
        stroke="#E30613" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.9"/>
  
  <!-- Detalles de brillo -->
  <circle cx="14" cy="16" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="34" cy="16" r="1.5" fill="#FF4444" opacity="0.6"/>
  
  <!-- Línea inferior decorativa -->
  <rect x="12" y="52" width="40" height="2" fill="#E30613" rx="1" opacity="0.7"/>
</svg>
